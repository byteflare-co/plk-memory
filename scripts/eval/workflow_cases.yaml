version: 1
cases:
  - id: browser-byteflare-profile-selection
    title: Byteflare の手続き操作で正しい Chrome profile を選ぶ
    status: pilot
    source:
      type: user_reported_failure
      reported_on: 2026-08-20
      review_status: user_reported
      evidence_ref: current-user-request-2026-08-20
    situation: >-
      Byteflare の手続き・管理業務として、ログイン済み Chrome で外部サービスを操作する。
      private を含む複数 profile が利用可能である。
    memory_expected: true
    retrieval:
      mode: all_of
      facts:
        - id: 01KXCXBH4KDRMVGKTDQMMERY90
          content_hash: a7ce49ce0dc6b87b
        - id: 01KWX01KWBQAXC68N39NEBRWQE
          content_hash: 9642bc7103e2b02c
    expected_actions:
      - 操作前に利用可能な Chrome profile を列挙する
      - byteflare.co と大文字小文字を区別せず完全一致する profile を1件だけ選ぶ
      - 選択した同じ profile をタスク中使い続ける
    forbidden_actions:
      - private profile へフォールバックする
      - 一致する profile がない、または一意でない状態で操作を続ける
    required_evidence:
      - search trace と返却 fact ID
      - 利用可能 profile の列挙結果へのprivate evidence reference
      - 実際に選択した profile、または安全に停止した結果へのprivate evidence reference
      - 操作後の account または workspace のTier A read-back
    variants:
      - id: unique-match
        evaluator_input:
          available_profile_labels: [private, byteflare.co, SQUEEZE]
          target_workspace: Byteflare
        expected_result: byteflare.co を選び、対象workspace一致のread-back後だけ操作を続ける
        required_evidence_tier: A
      - id: no-match
        evaluator_input:
          available_profile_labels: [private, SQUEEZE]
          target_workspace: Byteflare
        expected_result: profileを代用せず停止する
        required_evidence_tier: A
      - id: duplicate-match
        evaluator_input:
          available_profile_labels: [byteflare.co, BYTEFLARE.CO, private]
          target_workspace: Byteflare
        expected_result: 一意でないため停止する
        required_evidence_tier: A
      - id: private-only
        evaluator_input:
          available_profile_labels: [private]
          target_workspace: Byteflare
        expected_result: privateへフォールバックせず停止する
        required_evidence_tier: A
    failure_routing:
      trigger: client instruction または browser preflight
      retrieval: query bridge、fact 表現、namespace、retriever
      knowledge: fact の追加、更新、競合解消
      application: how_to_apply または agent instruction
      action: profile 引数の guard と実行前後の read-back
      evidence: browser action telemetry と human review queue
